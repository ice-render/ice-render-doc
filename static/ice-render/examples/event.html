<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>事件机制 · Live Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>事件机制：ICEEventTarget + EventBus</h1>
    <p class="lead">
      Canvas 内部没有 DOM 事件，引擎用 <code>ICEEventTarget</code>（模仿 W3C EventTarget，别名
      <code>addEventListener/on/off</code>）给每个组件挂事件，原生 DOM 事件经
      <code>DOMEventDispatcher</code> 转发成 <code>ICEEvent</code> 后派发到对应组件。下面三个图形都可点击 /
      悬停，日志实时打印派发过程。
    </p>
    <div class="row">
      <div class="card"><canvas id="canvas" width="520" height="360"></canvas></div>
      <div class="card">
        <div class="toolbar">
          <button class="primary" id="clear">清空日志</button>
          <button id="suspend">挂起 click</button>
        </div>
        <div class="log" id="log">事件日志：</div>
      </div>
    </div>
    <script src="../ice-render.js"></script>
    <script>
      const { ICE, ICERect, ICECircle, ICEText } = window.ICE;
      const log = document.getElementById('log');
      const push = (m) => { log.textContent += '\n' + m; log.scrollTop = log.scrollHeight; };
      const ice = new ICE.ICE().init('canvas', { renderMode: 'dirty-rect' });

      const rect = new ICERect({
        left: 40, top: 60, width: 150, height: 150, radius: 12,
        style: { fillStyle: '#3B82F6', strokeStyle: '#1D4ED8', lineWidth: 2 },
      });
      const circle = new ICECircle({
        left: 300, top: 60, radius: 75,
        style: { fillStyle: '#10B981', strokeStyle: '#047857', lineWidth: 2 },
      });
      const label = new ICEText({
        left: 150, top: 250, text: '悬停 / 点击我',
        style: { fontSize: 22, fillStyle: '#374151' },
      });
      ice.addChild(rect); ice.addChild(circle); ice.addChild(label);

      // 组件级事件：原生 DOM 事件名（click / mouseenter / mouseleave / mousedown）直接 on
      rect.on('click', () => push('rect click → ICERect'));
      circle.on('click', () => push('circle click → ICECircle'));
      label.on('click', () => push('label click → ICEText'));

      [rect, circle, label].forEach((c, i) => {
        c.on('mouseenter', () => {
          push('mouseenter → 组件#' + i);
          c.setState({ style: { ...c.state.style, shadow: 'md' } });
        });
        c.on('mouseleave', () => {
          push('mouseleave → 组件#' + i);
          c.setState({ style: { ...c.state.style, shadow: 'none' } });
        });
      });

      // 总线级事件：所有 ICE 实例共享的 EventBus 也能监听（这里监听渲染完成）
      ice.evtBus.on('AFTER_RENDER', () => { /* 每帧；此 demo 不打印避免刷屏 */ });

      document.getElementById('clear').onclick = () => { log.textContent = '事件日志：'; };
      const suspendBtn = document.getElementById('suspend');
      let suspended = false;
      suspendBtn.onclick = () => {
        suspended = !suspended;
        if (suspended) { rect.suspend('click'); circle.suspend('click'); label.suspend('click'); suspendBtn.textContent = '恢复 click'; push('—— click 已挂起 ——'); }
        else { rect.resume('click'); circle.resume('click'); label.resume('click'); suspendBtn.textContent = '挂起 click'; push('—— click 已恢复 ——'); }
      };
    </script>
  </body>
</html>
