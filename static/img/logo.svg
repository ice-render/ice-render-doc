<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="24" fill="#7DD3FC"/>
  <g transform="translate(100,100)" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- center hexagon -->
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9"/>
    <!-- 6 outer arms (60° apart): stem → Y-fork → circle tip -->
    <g id="arm"><line x1="15.6" y1="-9" x2="38" y2="-22"/><line x1="30" y1="-28" x2="38" y2="-22"/><line x1="34" y1="-18" x2="38" y2="-22"/><circle cx="46" cy="-26" r="8"/></g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <!-- 6 inner branches (60° apart): stem → Y-fork → circle tip -->
    <g id="branch"><line x1="0" y1="-18" x2="0" y2="-36"/><line x1="-8" y1="-30" x2="0" y2="-36"/><line x1="8" y1="-30" x2="0" y2="-36"/><circle cx="0" cy="-42" r="8"/></g>
    <use href="#branch" transform="rotate(60)"/>
    <use href="#branch" transform="rotate(120)"/>
    <use href="#branch" transform="rotate(180)"/>
    <use href="#branch" transform="rotate(240)"/>
    <use href="#branch" transform="rotate(300)"/>
  </g>
</svg>
